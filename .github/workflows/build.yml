# Builds and tests DeskFlow on Windows for every push, and uploads the
# .msi and setup .exe installers as a downloadable workflow artifact.
name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build UI
        run: npm run build

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installers
        run: npx tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: DeskFlow-installers-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Report binary size
        shell: pwsh
        run: |
          $exe = Get-Item src-tauri/target/release/deskflow.exe
          "deskflow.exe: {0:N1} MB" -f ($exe.Length / 1MB) | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
