# Builds and tests DeskFlow on Windows for every push, and uploads the
# .msi and setup .exe installers as a downloadable workflow artifact.
name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build UI
        run: npm run build

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installers
        run: npx tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: DeskFlow-installers-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Publish the latest main build as a public "dev" release so the
      # installer can be downloaded without signing in to GitHub.
      - name: Publish dev release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev --prerelease --target "$GITHUB_SHA" \
            --title "DeskFlow dev build (${GITHUB_SHA::7})" \
            --notes "Latest build of main. Not code-signed yet: on install, Windows SmartScreen may ask you to click More info > Run anyway." \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/bundle/msi/*.msi

      - name: Report binary size
        shell: pwsh
        run: |
          $exe = Get-Item src-tauri/target/release/deskflow.exe
          "deskflow.exe: {0:N1} MB" -f ($exe.Length / 1MB) | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
