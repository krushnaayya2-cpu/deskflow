[package]
name = "deskflow"
version = "0.2.0"
description = "DeskFlow - desktop organizer, glass dock, Dynamic Island and file converter for Windows 11"
edition = "2021"
rust-version = "1.80"

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows.
name = "deskflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-opener = "2"
notify = "8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Media_Control",
  "Networking_Connectivity",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Power",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# Small, fast binary: helps the <2 s startup and <80 MB idle targets.
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
